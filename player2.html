<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player (Apple Music Style)</title>
    <style>
        :root {
            --primary-bg: #1c1c1e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.5);
            --accent: #fa2d48;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--primary-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 1. 动态流光背景 (Mesh Gradient Simulation) --- */
        .ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 { width: 400px; height: 400px; background: #4a00e0; top: -50px; left: -50px; animation-duration: 12s; }
        .orb-2 { width: 350px; height: 350px; background: #8e2de2; bottom: -50px; right: -50px; animation-duration: 9s; animation-delay: -2s; }
        .orb-3 { width: 300px; height: 300px; background: #fa2d48; top: 40%; left: 40%; animation-duration: 15s; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* --- 2. 主界面布局 --- */
        .player-container {
            width: 90%;
            max-width: 450px;
            height: 85vh;
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        /* --- 顶部栏 --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn-icon {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-icon:hover { background: rgba(255,255,255,0.2); }

        #audioFile {
            position: absolute;
            font-size: 100px;
            opacity: 0;
            right: 0;
            top: 0;
            cursor: pointer;
        }

        /* --- 歌词视图 --- */
        .lyrics-container {
            flex: 1;
            overflow-y: auto;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            scrollbar-width: none; /* Firefox */
            position: relative;
            display: flex;
            flex-direction: column;
            padding-top: 50%; /* 初始留白 */
            padding-bottom: 50%;
        }
        
        .lyrics-container::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.5;
            padding: 12px 0;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            color: var(--text-inactive);
            filter: blur(1.5px);
            transform-origin: left center;
            transform: scale(0.95);
            
            /* 逐字填充效果的核心 */
            background-clip: text;
            -webkit-background-clip: text;
            background-image: linear-gradient(90deg, white 0%, white 0%, var(--text-inactive) 0%);
            background-size: 0% 100%; /* 初始进度0 */
            background-repeat: no-repeat;
        }

        .lyric-line.active {
            filter: blur(0);
            transform: scale(1);
            color: transparent; /* 文字透明，显示背景渐变 */
            /* 这里的 background-size 会由 JS 动态更新实现卡拉OK效果 */
        }

        /* --- 底部控制栏 --- */
        .controls-area {
            margin-top: 20px;
        }

        .song-info {
            margin-bottom: 15px;
        }
        .song-title { font-size: 20px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 14px; color: var(--text-inactive); margin: 5px 0 0; }

        /* 进度条 */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            border-radius: 2px;
            position: relative;
        }
        .progress-handle {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            right: -6px;
            top: -4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transform: scale(0);
            transition: transform 0.2s;
        }
        .progress-container:hover .progress-handle { transform: scale(1); }

        /* 按钮组 */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .btn-control {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-control:active { transform: scale(0.9); }
        .btn-play {
            width: 60px;
            height: 60px;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-inactive);
            margin-top: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- 1. 动态流光背景 -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- 2. 主播放器 -->
    <div class="player-container">
        <div class="top-bar">
            <div class="file-input-wrapper">
                <button class="btn-icon" title="选择本地音乐">📂</button>
                <input type="file" id="audioFile" accept="audio/*">
            </div>
            <div style="font-size: 12px; font-weight: 600; opacity: 0.5;">WEB MUSIC</div>
            <button class="btn-icon">⋯</button>
        </div>

        <!-- 歌词区域 -->
        <div class="lyrics-container" id="lyricsBox">
            <div class="lyric-line" style="text-align: center; margin-top: 50%;">
                请点击左上角<br>选择本地音乐文件
            </div>
        </div>

        <!-- 底部控制 -->
        <div class="controls-area">
            <div class="song-info">
                <h2 class="song-title" id="songTitle">未播放</h2>
                <p class="song-artist" id="songArtist">选择文件以开始</p>
            </div>

            <div class="progress-container" id="progressBar">
                <div class="progress-fill" id="progressFill">
                    <div class="progress-handle"></div>
                </div>
            </div>
            <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="buttons">
                <button class="btn-control" id="prevBtn">⏮</button>
                <button class="btn-control btn-play" id="playBtn">▶</button>
                <button class="btn-control" id="nextBtn">⏭</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // --- 模拟数据: 演示用的逐字歌词 (当没有本地歌词文件时使用) ---
        const DEMO_LYRICS = `
[00:00.00]Web Music Player
[00:04.00]这是一个演示歌词
[00:08.00]支持流光背景效果
[00:12.00]仿 Apple Music 界面设计
[00:16.00]每一行歌词
[00:19.00]都会随着时间精准高亮
[00:23.00]当前播放行会放大且清晰
[00:27.00]其他行则会模糊处理
[00:31.00]点击左上角图标
[00:34.00]导入你自己的音乐吧
`;

        // --- 核心逻辑 ---
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const fileInput = document.getElementById('audioFile');
        const lyricsBox = document.getElementById('lyricsBox');
        const progressContainer = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        
        let lyricsData = []; // [{time: 0, text: "xxx"}, ...]
        let currentLineIndex = -1;

        // 1. 歌词解析器 (LRC格式)
        function parseLRC(lrcString) {
            const lines = lrcString.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            lines.forEach(line => {
                const match = timeReg.exec(line);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0')); // 补齐毫秒位数
                    const time = min * 60 + sec + ms / 1000;
                    const text = line.replace(timeReg, '').trim();
                    if (text) {
                        result.push({ time, text });
                    }
                }
            });
            return result;
        }

        // 2. 渲染歌词界面
        function renderLyrics(data) {
            lyricsBox.innerHTML = '';
            // 顶部占位，方便第一句居中
            const spacer = document.createElement('div');
            spacer.style.height = "50%";
            lyricsBox.appendChild(spacer);

            data.forEach((line, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.innerText = line.text;
                div.dataset.index = index;
                div.dataset.time = line.time;
                
                // 点击歌词跳转
                div.addEventListener('click', () => {
                    audio.currentTime = line.time;
                    playAudio();
                });
                
                lyricsBox.appendChild(div);
            });

            // 底部占位
            const spacerBottom = document.createElement('div');
            spacerBottom.style.height = "80%";
            lyricsBox.appendChild(spacerBottom);
        }

        // 3. 高亮与滚动算法
        function updateLyricsUI() {
            const currentTime = audio.currentTime;
            
            // 找到当前播放的那一行
            let activeIndex = lyricsData.findIndex((line, i) => {
                const nextTime = lyricsData[i + 1] ? lyricsData[i + 1].time : Infinity;
                return currentTime >= line.time && currentTime < nextTime;
            });

            if (activeIndex === -1 && currentTime > 0 && lyricsData.length > 0) {
                // 如果播放时间超过最后一行，保持最后一行
                if (currentTime >= lyricsData[lyricsData.length - 1].time) {
                    activeIndex = lyricsData.length - 1;
                }
            }

            // 更新样式
            if (activeIndex !== currentLineIndex) {
                // 移除旧的高亮
                const oldActive = lyricsBox.querySelector('.lyric-line.active');
                if (oldActive) {
                    oldActive.classList.remove('active');
                    oldActive.style.backgroundSize = '0% 100%'; // 重置进度
                }

                currentLineIndex = activeIndex;

                if (activeIndex !== -1) {
                    const lines = lyricsBox.querySelectorAll('.lyric-line');
                    const activeLine = lines[activeIndex];
                    activeLine.classList.add('active');

                    // 滚动到中心
                    activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            // --- 模拟逐字效果 (Karaoke Fill) ---
            if (activeIndex !== -1) {
                const lines = lyricsBox.querySelectorAll('.lyric-line');
                const activeLine = lines[activeIndex];
                const currentLineData = lyricsData[activeIndex];
                const nextLineData = lyricsData[activeIndex + 1];
                
                // 计算当前行持续时间
                const duration = nextLineData ? (nextLineData.time - currentLineData.time) : 5; // 默认5秒
                const progress = Math.min(1, Math.max(0, (currentTime - currentLineData.time) / duration));
                
                // 使用 background-size 控制白色渐变覆盖的宽度
                activeLine.style.backgroundSize = `${progress * 100}% 100%`;
            }
        }

        // 4. 事件监听与播放控制
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audio.src = url;
                document.getElementById('songTitle').innerText = file.name.replace(/\.[^/.]+$/, "");
                
                // 真实场景下这里应该读取同名的 .lrc 文件
                // 这里为了演示，我们使用默认的 Demo 歌词
                lyricsData = parseLRC(DEMO_LYRICS);
                renderLyrics(lyricsData);
                
                playAudio();
            }
        });

        function playAudio() {
            audio.play();
            playBtn.innerText = '⏸';
            // 启动背景动画加速
            document.querySelectorAll('.orb').forEach(orb => orb.style.animationDuration = '4s');
        }

        function pauseAudio() {
            audio.pause();
            playBtn.innerText = '▶';
            // 恢复背景动画慢速
            document.querySelectorAll('.orb').forEach(orb => orb.style.animationDuration = '');
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) playAudio();
            else pauseAudio();
        });

        // 进度更新循环
        audio.addEventListener('timeupdate', () => {
            // 更新进度条
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration || 0);

            // 更新歌词
            updateLyricsUI();
        });

        // 进度条拖拽
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        // 格式化时间
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // 初始化演示界面
        lyricsData = parseLRC(DEMO_LYRICS);
        renderLyrics(lyricsData);

    </script>
</body>
</html>
