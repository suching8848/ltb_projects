<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Local Music Player (Apple Music-ish)</title>
  <style>
    :root{
      --bg0:#070A12;
      --bg1:#0A0F22;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.10);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --muted2: rgba(255,255,255,.45);
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 28px;
      --accent: 255, 80, 120;  /* rgb for accent glow */
      --accent2: 90, 180, 255;
      --accent3: 140, 255, 200;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, #131A3A 0%, transparent 55%),
                  radial-gradient(900px 700px at 80% 20%, #24113A 0%, transparent 52%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
    }

    /* Aurora layer */
    .aurora{
      position:fixed; inset:-20%;
      pointer-events:none;
      opacity:.95;
      filter:saturate(1.25);
      transform: translateZ(0);
      display:none;
    }
    .aurora.on{ display:block; }
    .aurora::before,
    .aurora::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(700px 380px at 20% 30%, rgba(var(--accent),.38), transparent 62%),
        radial-gradient(650px 420px at 70% 25%, rgba(var(--accent2),.30), transparent 58%),
        radial-gradient(640px 420px at 55% 70%, rgba(var(--accent3),.26), transparent 60%),
        radial-gradient(780px 520px at 30% 80%, rgba(180,120,255,.18), transparent 60%);
      filter: blur(36px);
      animation: floaty 14s ease-in-out infinite alternate;
    }
    .aurora::after{
      filter: blur(54px);
      opacity:.7;
      animation: floaty2 18s ease-in-out infinite alternate;
    }
    @keyframes floaty{
      from{ transform: translate3d(-2%, -1%, 0) scale(1.08) rotate(-2deg); }
      to  { transform: translate3d( 2%,  2%, 0) scale(1.16) rotate( 2deg); }
    }
    @keyframes floaty2{
      from{ transform: translate3d( 1%, -2%, 0) scale(1.10) rotate( 2deg); }
      to  { transform: translate3d(-2%,  1%, 0) scale(1.18) rotate(-2deg); }
    }

    /* Layout */
    .app{
      position:relative;
      height:100%;
      padding:22px;
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:18px;
      align-items:stretch;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .app{
        height:auto;
        grid-template-columns: 1fr;
        padding:16px;
      }
    }

    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      border-radius: var(--radius2);
      overflow:hidden;
      position:relative;
    }
    .glass.on .card{
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* Top bar */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent);
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      min-width:0;
    }
    .logo{
      width:34px; height:34px; border-radius:12px;
      background: radial-gradient(18px 18px at 30% 30%, rgba(var(--accent),.9), transparent 60%),
                  radial-gradient(18px 18px at 70% 70%, rgba(var(--accent2),.9), transparent 60%),
                  rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
    }
    .brand h1{
      font-size:14px;
      margin:0;
      letter-spacing:.3px;
      font-weight:650;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand .sub{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .right-actions{
      display:flex; gap:10px; align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color:var(--text);
      padding:9px 12px;
      border-radius: 14px;
      font-size:12px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); }
    .btn:active{ transform: scale(.98); }
    .btn.primary{
      background: rgba(var(--accent),.18);
      border-color: rgba(var(--accent),.36);
    }
    .btn.primary:hover{
      background: rgba(var(--accent),.24);
      border-color: rgba(var(--accent),.46);
    }
    .toggle{
      display:flex; gap:8px; align-items:center;
      padding:8px 10px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.15);
      font-size:12px;
      color:var(--muted);
    }
    .switch{
      width:38px; height:22px; border-radius:999px;
      background: rgba(255,255,255,.14);
      position:relative;
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
    }
    .knob{
      width:18px; height:18px; border-radius:999px;
      background: rgba(255,255,255,.88);
      position:absolute; top:1px; left:1px;
      transition:left .14s ease, background .14s ease;
    }
    .switch.on{ background: rgba(var(--accent2),.22); border-color: rgba(var(--accent2),.30); }
    .switch.on .knob{ left:18px; background: rgba(255,255,255,.95); }

    /* Left: player */
    .player{
      display:flex; flex-direction:column;
      min-height:560px;
    }
    .hero{
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .cover{
      width:100%;
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      background:
        radial-gradient(90px 90px at 30% 28%, rgba(var(--accent),.40), transparent 60%),
        radial-gradient(120px 120px at 78% 30%, rgba(var(--accent2),.32), transparent 60%),
        radial-gradient(140px 140px at 55% 78%, rgba(var(--accent3),.24), transparent 62%),
        rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 22px 50px rgba(0,0,0,.55);
      position:relative;
      overflow:hidden;
    }
    .cover::after{
      content:"";
      position:absolute; inset:-10%;
      background:
        radial-gradient(220px 220px at 25% 30%, rgba(var(--accent),.22), transparent 62%),
        radial-gradient(260px 260px at 75% 25%, rgba(var(--accent2),.18), transparent 62%);
      filter: blur(18px);
      opacity:.85;
      animation: covermove 10s ease-in-out infinite alternate;
    }
    @keyframes covermove{
      from{ transform: translate(-2%, -1%) scale(1.06); }
      to  { transform: translate( 2%,  2%) scale(1.10); }
    }
    .meta{
      display:flex; flex-direction:column;
      gap:6px;
      min-width:0;
    }
    .title{
      font-size:16px;
      font-weight:720;
      margin:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .artist{
      font-size:13px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .smallrow{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      margin-top:4px;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      max-width:60%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Controls */
    .controls{
      padding:0 16px 16px 16px;
      display:flex; flex-direction:column;
      gap:12px;
    }
    .progress{
      display:flex; flex-direction:column; gap:8px;
    }
    .bar{
      height:10px;
      border-radius:999px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.10);
      overflow:hidden;
      position:relative;
      cursor:pointer;
    }
    .bar > .fill{
      height:100%;
      width:0%;
      background: linear-gradient(90deg,
        rgba(var(--accent2),.75),
        rgba(var(--accent),.78),
        rgba(var(--accent3),.70));
      box-shadow: 0 10px 18px rgba(0,0,0,.28);
    }
    .time{
      display:flex; justify-content:space-between;
      font-size:12px; color:var(--muted2);
    }
    .transport{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:2px;
    }
    .tgroup{
      display:flex; align-items:center; gap:10px;
    }
    .iconbtn{
      width:44px; height:44px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      cursor:pointer;
      display:grid; place-items:center;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .iconbtn:hover{ background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.24); }
    .iconbtn:active{ transform: scale(.98); }
    .play{
      width:54px; height:54px; border-radius: 18px;
      background: rgba(var(--accent),.20);
      border-color: rgba(var(--accent),.35);
      box-shadow: 0 16px 28px rgba(0,0,0,.35);
    }
    .play:hover{ background: rgba(var(--accent),.26); border-color: rgba(var(--accent),.46); }
    .vol{
      display:flex; align-items:center; gap:10px;
      min-width:140px;
    }
    input[type="range"]{
      width:100%;
      accent-color: rgba(var(--accent2),.9);
      cursor:pointer;
    }

    /* Right: lyrics */
    .lyrics{
      display:flex; flex-direction:column;
      min-height:560px;
    }
    .lyrics-head{
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent);
    }
    .lyrics-head h2{
      margin:0;
      font-size:14px;
      font-weight:720;
      letter-spacing:.2px;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:65%;
      text-align:right;
    }
    .lyrics-body{
      padding: 14px 16px 16px 16px;
      overflow:auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.20) transparent;
      height:100%;
    }
    .lyrics-body::-webkit-scrollbar{ width:10px; }
    .lyrics-body::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.16);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .line{
      padding:10px 10px;
      border-radius: 14px;
      margin: 4px 0;
      color: rgba(255,255,255,.55);
      transition: background .12s ease, color .12s ease, transform .12s ease;
      line-height: 1.65;
      font-size: 16px;
      letter-spacing: .2px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .line .t{
      flex: 0 0 auto;
      font-size:12px;
      color: rgba(255,255,255,.30);
      padding-top:3px;
      min-width:54px;
      text-align:right;
    }
    .line .txt{
      flex:1 1 auto;
      min-width:0;
      word-break:break-word;
    }
    .line.active{
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.92);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
    }
    .line.active .t{ color: rgba(255,255,255,.48); }
    .line .word{
      position:relative;
      display:inline-block;
      padding:0 1px;
      margin:0 0.2px;
      border-radius:8px;
    }
    .line.active .word{
      color: rgba(255,255,255,.55);
    }
    /* word highlight overlay */
    .line .word::after{
      content:"";
      position:absolute; left:0; top:0; bottom:0;
      width: var(--p, 0%);
      background: linear-gradient(90deg,
        rgba(var(--accent2),.85),
        rgba(var(--accent),.85),
        rgba(var(--accent3),.85));
      border-radius:8px;
      mix-blend-mode: screen;
      opacity: .92;
      pointer-events:none;
      filter: blur(.0px);
    }
    .line .word > span{
      position:relative;
      z-index:1;
    }
    .line.active .word > span{
      color: rgba(255,255,255,.95);
    }

    .empty{
      color: var(--muted);
      font-size:13px;
      line-height:1.8;
      padding: 10px;
      border: 1px dashed rgba(255,255,255,.18);
      border-radius: 16px;
      background: rgba(0,0,0,.12);
    }

    /* hidden inputs */
    .hidden{ display:none; }

    /* mini toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      padding:10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.88);
      font-size:12px;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
      opacity:0;
      pointer-events:none;
      transition: opacity .16s ease, transform .16s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index:50;
      max-width:min(680px, calc(100% - 24px));
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.on{ opacity:1; transform:translateX(-50%) translateY(-2px); }

    /* App mode toggles applied to body */
    body.glass-enabled .glassToggleLabel{ color: rgba(255,255,255,.88); }
    body.aurora-enabled .auroraToggleLabel{ color: rgba(255,255,255,.88); }
  </style>
</head>
<body class="glass-enabled aurora-enabled">
  <div class="aurora on" id="aurora"></div>

  <div class="app glass on" id="app">
    <!-- Left: Player -->
    <section class="card player">
      <div class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div style="min-width:0">
            <h1 id="brandTitle">Local Music</h1>
            <div class="sub" id="brandSub">本地音乐播放器（支持逐字歌词）</div>
          </div>
        </div>

        <div class="right-actions">
          <button class="btn primary" id="btnPickAudio">选择音乐</button>
          <button class="btn" id="btnPickLyric">选择歌词</button>

          <div class="toggle">
            <span class="glassToggleLabel">模糊</span>
            <div class="switch on" id="swGlass" role="switch" aria-checked="true"><div class="knob"></div></div>
          </div>
          <div class="toggle">
            <span class="auroraToggleLabel">流光</span>
            <div class="switch on" id="swAurora" role="switch" aria-checked="true"><div class="knob"></div></div>
          </div>
        </div>
      </div>

      <div class="hero">
        <div class="cover" id="cover" aria-label="cover"></div>

        <div class="meta">
          <p class="title" id="trackTitle">未选择音乐</p>
          <div class="artist" id="trackArtist">请选择本地音频文件（mp3/m4a/wav/ogg 等）</div>
          <div class="smallrow">
            <div class="pill" id="lyricModePill">歌词：未加载</div>
            <div class="pill" id="formatPill">格式：—</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="progress">
          <div class="bar" id="bar" title="点击跳转">
            <div class="fill" id="barFill"></div>
          </div>
          <div class="time">
            <span id="tCur">00:00</span>
            <span id="tDur">00:00</span>
          </div>
        </div>

        <div class="transport">
          <div class="tgroup">
            <div class="iconbtn" id="btnBack" title="后退 5 秒">⟲</div>
            <div class="iconbtn play" id="btnPlay" title="播放/暂停">▶</div>
            <div class="iconbtn" id="btnFwd" title="前进 5 秒">⟳</div>
          </div>

          <div class="vol">
            <span style="font-size:12px;color:var(--muted)">音量</span>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" />
          </div>
        </div>
      </div>

      <input class="hidden" type="file" id="fileAudio" accept="audio/*" />
      <input class="hidden" type="file" id="fileLyric" accept=".lrc,.txt,.json" />
      <audio id="audio" preload="metadata"></audio>
    </section>

    <!-- Right: Lyrics -->
    <section class="card lyrics">
      <div class="lyrics-head">
        <h2>歌词</h2>
        <div class="hint" id="lyricHint">支持 LRC 与逐字扩展 LRC（角括号时间戳）</div>
      </div>
      <div class="lyrics-body" id="lyricsBody">
        <div class="empty">
          <div style="font-weight:650;color:rgba(255,255,255,.86);margin-bottom:6px;">使用方法</div>
          <div>1) 点击左侧“选择音乐”加载本地音频。</div>
          <div>2) 点击“选择歌词”加载 .lrc/.txt/.json。</div>
          <div style="margin-top:8px;">逐字歌词扩展 LRC 示例：</div>
          <div style="margin-top:6px;color:rgba(255,255,255,.75);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
            [00:10.00] &lt;00:10.00&gt;你&lt;00:10.25&gt;好&lt;00:10.55&gt;世&lt;00:10.80&gt;界
          </div>
          <div style="margin-top:10px;">标准 LRC 示例：</div>
          <div style="margin-top:6px;color:rgba(255,255,255,.75);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
            [00:12.00] 这是按行歌词
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ---------------------------
    // Utilities
    // ---------------------------
    const $ = (s) => document.querySelector(s);

    function toast(msg){
      const el = $("#toast");
      el.textContent = msg;
      el.classList.add("on");
      clearTimeout(toast._t);
      toast._t = setTimeout(()=> el.classList.remove("on"), 1800);
    }

    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    function pad2(n){ return String(n).padStart(2,"0"); }
    function fmtTime(sec){
      if(!Number.isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${pad2(m)}:${pad2(s)}`;
    }
    function parseTimeToSec(t){
      // supports mm:ss.xx or m:ss or mm:ss
      // also allow hh:mm:ss.xx (optional)
      const parts = t.trim().split(":").map(x=>x.trim());
      if(parts.length === 2){
        const m = Number(parts[0]);
        const s = Number(parts[1]);
        if(!Number.isFinite(m) || !Number.isFinite(s)) return NaN;
        return m*60 + s;
      }
      if(parts.length === 3){
        const h = Number(parts[0]);
        const m = Number(parts[1]);
        const s = Number(parts[2]);
        if(!Number.isFinite(h)||!Number.isFinite(m)||!Number.isFinite(s)) return NaN;
        return h*3600 + m*60 + s;
      }
      return NaN;
    }

    // ---------------------------
    // Lyric model
    // lines: [{time:number, raw:string, words?:[{t:number, text:string}]}]
    // word timing format: [lineTime] <t>word<t>word...
    // highlight uses current time between word[i].t and word[i+1].t
    // ---------------------------
    function parseLyrics(text){
      const src = text.replace(/\r/g,"");
      const lines = src.split("\n");

      // If JSON format: expect { "lines": [ { "time": 12.34, "words":[{"t":12.34,"text":"你"}, ...] } ] }
      const trimmed = src.trim();
      if(trimmed.startsWith("{") || trimmed.startsWith("[")){
        try{
          const obj = JSON.parse(trimmed);
          const arr = Array.isArray(obj) ? obj : (obj.lines || obj.lyrics || []);
          const normalized = arr
            .map(x => ({
              time: Number(x.time),
              raw: String(x.raw ?? x.text ?? ""),
              words: Array.isArray(x.words) ? x.words.map(w=>({t:Number(w.t), text:String(w.text ?? "")})) : null
            }))
            .filter(x => Number.isFinite(x.time))
            .sort((a,b)=>a.time-b.time);

          const mode = normalized.some(l=>Array.isArray(l.words) && l.words.length>0) ? "word" : "line";
          return { mode, lines: normalized };
        }catch(e){
          // fall through to LRC parse
        }
      }

      const out = [];
      let hasWord = false;

      // LRC tags: [mm:ss.xx]text or multiple timestamps per line
      // Word timestamps: <mm:ss.xx>token
      const timeTagRe = /\[(\d{1,2}:\d{2}(?:\.\d{1,3})?)\]/g;
      const wordTagRe = /<(\d{1,2}:\d{2}(?:\.\d{1,3})?)>/g;

      for(const ln of lines){
        if(!ln.trim()) continue;

        // extract all [..] at beginning or anywhere
        const times = [];
        let m;
        while((m = timeTagRe.exec(ln)) !== null){
          const t = parseTimeToSec(m[1]);
          if(Number.isFinite(t)) times.push(t);
        }
        if(times.length === 0) continue;

        const after = ln.replace(timeTagRe, "").trim();

        // try parse word-level <..>
        const wordTimes = [];
        let w;
        while((w = wordTagRe.exec(after)) !== null){
          const t = parseTimeToSec(w[1]);
          if(Number.isFinite(t)) wordTimes.push({ idx: w.index, t });
        }

        if(wordTimes.length > 0){
          // split tokens by word tags
          // example: <00:10.00>你<00:10.25>好...
          hasWord = true;
          const words = [];
          // We'll iterate matches and take text between this tag and next tag
          const matches = [...after.matchAll(wordTagRe)];
          for(let i=0;i<matches.length;i++){
            const t = parseTimeToSec(matches[i][1]);
            const start = matches[i].index + matches[i][0].length;
            const end = (i+1 < matches.length) ? matches[i+1].index : after.length;
            const token = after.slice(start, end);
            if(Number.isFinite(t) && token.length){
              words.push({ t, text: token });
            }else if(Number.isFinite(t)){
              // allow empty tokens; still keep for timing continuity
              words.push({ t, text: "" });
            }
          }

          // Build raw text removing tags
          const raw = after.replace(wordTagRe, "");
          for(const t0 of times){
            out.push({ time: t0, raw, words });
          }
        }else{
          for(const t0 of times){
            out.push({ time: t0, raw: after, words: null });
          }
        }
      }

      out.sort((a,b)=>a.time-b.time);

      // If word timing exists, we still keep per-line timestamp; word times are absolute, so it works across lines.
      // If word timing are relative (rare), you can convert by adding line time; not implemented here.
      return { mode: hasWord ? "word" : "line", lines: out };
    }

    // ---------------------------
    // Render & sync lyrics
    // ---------------------------
    const lyricsBody = $("#lyricsBody");
    let lyricData = { mode:"none", lines:[] };
    let lineEls = [];
    let activeLine = -1;

    function clearLyrics(){
      lyricData = { mode:"none", lines:[] };
      lineEls = [];
      activeLine = -1;
      lyricsBody.innerHTML = `
        <div class="empty">
          <div style="font-weight:650;color:rgba(255,255,255,.86);margin-bottom:6px;">尚未加载歌词</div>
          <div>请选择歌词文件（.lrc/.txt/.json）。</div>
        </div>`;
      $("#lyricModePill").textContent = "歌词：未加载";
      $("#formatPill").textContent = "格式：—";
    }

    function renderLyrics(){
      lyricsBody.innerHTML = "";
      lineEls = [];
      activeLine = -1;

      if(!lyricData.lines.length){
        clearLyrics();
        return;
      }

      $("#lyricModePill").textContent =
        lyricData.mode === "word" ? "歌词：逐字" :
        lyricData.mode === "line" ? "歌词：按行" : "歌词：—";

      $("#formatPill").textContent =
        lyricData.mode === "word" ? "格式：扩展 LRC（逐字）" :
        lyricData.mode === "line" ? "格式：标准 LRC" : "格式：—";

      const frag = document.createDocumentFragment();

      lyricData.lines.forEach((ln, idx)=>{
        const el = document.createElement("div");
        el.className = "line";
        el.dataset.idx = String(idx);
        el.dataset.time = String(ln.time);

        const t = document.createElement("div");
        t.className = "t";
        t.textContent = fmtTime(ln.time);

        const txt = document.createElement("div");
        txt.className = "txt";

        if(lyricData.mode === "word" && Array.isArray(ln.words) && ln.words.length){
          // Render tokens as .word spans (keep spaces as separate tokens if present)
          ln.words.forEach(w=>{
            const wEl = document.createElement("span");
            wEl.className = "word";
            wEl.style.setProperty("--p", "0%");
            wEl.dataset.t = String(w.t);
            const inner = document.createElement("span");
            inner.textContent = w.text;
            wEl.appendChild(inner);
            txt.appendChild(wEl);
          });
        }else{
          txt.textContent = ln.raw || "";
        }

        el.appendChild(t);
        el.appendChild(txt);

        el.addEventListener("click", ()=>{
          audio.currentTime = ln.time + 0.01;
        });

        frag.appendChild(el);
        lineEls.push(el);
      });

      lyricsBody.appendChild(frag);
    }

    function findActiveLineIndex(t){
      const arr = lyricData.lines;
      if(!arr.length) return -1;

      // binary search for last line.time <= t
      let lo = 0, hi = arr.length - 1, ans = -1;
      while(lo <= hi){
        const mid = (lo + hi) >> 1;
        if(arr[mid].time <= t){
          ans = mid;
          lo = mid + 1;
        }else{
          hi = mid - 1;
        }
      }
      return ans;
    }

    function syncWordHighlight(lineEl, t){
      // Highlight words within the active line based on absolute word timestamps
      const words = lineEl.querySelectorAll(".word");
      if(!words.length) return;

      // Build array of times from dataset
      const times = Array.from(words, w => Number(w.dataset.t)).filter(Number.isFinite);
      // times length should match words length generally
      for(let i=0;i<words.length;i++){
        const start = Number(words[i].dataset.t);
        const end = (i+1 < words.length) ? Number(words[i+1].dataset.t) : (start + 1.2);
        if(!Number.isFinite(start)) continue;

        let p = 0;
        if(t <= start) p = 0;
        else if(t >= end) p = 100;
        else{
          p = ((t - start) / Math.max(0.001, (end - start))) * 100;
        }
        words[i].style.setProperty("--p", `${clamp(p,0,100)}%`);
      }
    }

    function updateLyrics(t){
      if(!lyricData.lines.length || !lineEls.length) return;

      const idx = findActiveLineIndex(t);
      if(idx !== activeLine){
        // update active class
        if(activeLine >= 0 && lineEls[activeLine]) lineEls[activeLine].classList.remove("active");
        activeLine = idx;
        if(activeLine >= 0 && lineEls[activeLine]){
          const el = lineEls[activeLine];
          el.classList.add("active");

          // smooth scroll into view (keep it around middle)
          const top = el.offsetTop;
          const mid = lyricsBody.clientHeight * 0.35;
          lyricsBody.scrollTo({ top: Math.max(0, top - mid), behavior:"smooth" });
        }
      }

      // word highlight for current line
      if(lyricData.mode === "word" && activeLine >= 0 && lineEls[activeLine]){
        syncWordHighlight(lineEls[activeLine], t);
      }
    }

    // ---------------------------
    // Audio controls
    // ---------------------------
    const audio = $("#audio");
    const bar = $("#bar");
    const barFill = $("#barFill");
    const btnPlay = $("#btnPlay");
    const tCur = $("#tCur");
    const tDur = $("#tDur");
    const vol = $("#vol");

    let raf = 0;

    function setPlayIcon(){
      btnPlay.textContent = audio.paused ? "▶" : "⏸";
    }

    function setProgress(){
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 0;
      const p = dur > 0 ? (cur / dur) * 100 : 0;
      barFill.style.width = `${clamp(p,0,100)}%`;
      tCur.textContent = fmtTime(cur);
      tDur.textContent = fmtTime(dur);
      updateLyrics(cur);
    }

    function tick(){
      setProgress();
      raf = requestAnimationFrame(tick);
    }

    btnPlay.addEventListener("click", async ()=>{
      if(!audio.src){
        toast("请先选择本地音乐文件。");
        return;
      }
      if(audio.paused){
        try{ await audio.play(); }catch(e){ toast("播放被浏览器阻止，请再次点击播放。"); }
      }else{
        audio.pause();
      }
      setPlayIcon();
    });

    $("#btnBack").addEventListener("click", ()=>{
      audio.currentTime = Math.max(0, (audio.currentTime || 0) - 5);
    });
    $("#btnFwd").addEventListener("click", ()=>{
      audio.currentTime = Math.min((audio.duration || 0), (audio.currentTime || 0) + 5);
    });

    vol.addEventListener("input", ()=>{
      audio.volume = Number(vol.value);
    });
    audio.volume = Number(vol.value);

    audio.addEventListener("play", ()=>{ setPlayIcon(); });
    audio.addEventListener("pause", ()=>{ setPlayIcon(); });

    audio.addEventListener("loadedmetadata", ()=>{
      setProgress();
      toast("音频已加载。");
    });

    audio.addEventListener("ended", ()=>{
      setPlayIcon();
    });

    bar.addEventListener("click", (e)=>{
      const rect = bar.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const p = clamp(x / rect.width, 0, 1);
      if(Number.isFinite(audio.duration) && audio.duration > 0){
        audio.currentTime = p * audio.duration;
      }
    });

    // start ticker
    raf = requestAnimationFrame(tick);

    // ---------------------------
    // File pickers
    // ---------------------------
    const fileAudio = $("#fileAudio");
    const fileLyric = $("#fileLyric");

    $("#btnPickAudio").addEventListener("click", ()=> fileAudio.click());
    $("#btnPickLyric").addEventListener("click", ()=> fileLyric.click());

    fileAudio.addEventListener("change", ()=>{
      const f = fileAudio.files && fileAudio.files[0];
      if(!f) return;

      const url = URL.createObjectURL(f);
      audio.src = url;

      // basic metadata display
      $("#trackTitle").textContent = f.name.replace(/\.[^.]+$/, "");
      $("#trackArtist").textContent = `本地文件：${f.type || "audio"} / ${(f.size/1024/1024).toFixed(2)} MB`;
      $("#brandTitle").textContent = "Local Music";
      $("#brandSub").textContent = "已加载本地音频，可选择歌词文件同步显示";

      toast("已选择音乐文件。");
      setPlayIcon();

      // If there is already lyric, re-render (keep)
      if(lyricData.lines.length){
        renderLyrics();
      }
    });

    fileLyric.addEventListener("change", async ()=>{
      const f = fileLyric.files && fileLyric.files[0];
      if(!f) return;

      try{
        const text = await f.text();
        lyricData = parseLyrics(text);

        if(!lyricData.lines.length){
          toast("未解析到可用歌词时间戳。请检查歌词格式。");
          clearLyrics();
          return;
        }

        renderLyrics();
        toast(lyricData.mode === "word" ? "已加载逐字歌词。" : "已加载按行歌词。");
      }catch(e){
        toast("读取歌词文件失败。");
      }
    });

    // ---------------------------
    // Visual toggles
    // ---------------------------
    const swGlass = $("#swGlass");
    const swAurora = $("#swAurora");
    const app = $("#app");
    const aurora = $("#aurora");

    function setSwitch(sw, on){
      sw.classList.toggle("on", on);
      sw.setAttribute("aria-checked", on ? "true" : "false");
    }

    swGlass.addEventListener("click", ()=>{
      const on = !swGlass.classList.contains("on");
      setSwitch(swGlass, on);
      app.classList.toggle("on", on);
      document.body.classList.toggle("glass-enabled", on);
      toast(on ? "已开启模糊效果。" : "已关闭模糊效果。");
    });

    swAurora.addEventListener("click", ()=>{
      const on = !swAurora.classList.contains("on");
      setSwitch(swAurora, on);
      aurora.classList.toggle("on", on);
      document.body.classList.toggle("aurora-enabled", on);
      toast(on ? "已开启流光效果。" : "已关闭流光效果。");
    });

    // Init
    clearLyrics();
    setPlayIcon();
  </script>
</body>
</html>
